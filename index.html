    prompt('Copie ce lien :', url);
  });
});

// Restaurer l'état depuis l'URL au chargement
function restoreFromUrl() {
  const params = new URLSearchParams(location.search);
  if (params.has('niveau'))  { filterState.niveau  = params.get('niveau');  const el = document.getElementById('f-niveau');  if(el) el.value = filterState.niveau; }
  if (params.has('region'))  { filterState.region  = params.get('region');  const el = document.getElementById('f-region');  if(el) el.value = filterState.region; }
  if (params.has('duree'))   { filterState.duree   = params.get('duree');   const el = document.getElementById('f-duree');   if(el) el.value = filterState.duree; }
  if (params.has('milieu'))  { filterState.milieu  = params.get('milieu');  const el = document.getElementById('f-milieu');  if(el) el.value = filterState.milieu; }
  if (params.has('trajet'))  { filterState.trajet  = params.get('trajet');  const el = document.getElementById('f-trajet');  if(el) el.value = filterState.trajet; }
  if (params.get('locat')   === '1') { filterState.locat   = true; document.getElementById('ftog-locat-sw')?.classList.add('on'); }
  if (params.get('gratuit') === '1') { filterState.gratuit = true; document.getElementById('ftog-gratuit-sw')?.classList.add('on'); }
  if (params.get('ouvert')  === '1') { filterState.ouvert  = true; document.getElementById('ftog-ouvert-sw')?.classList.add('on'); }
  // On appliquera les filtres + OID après le chargement des features (dans arcgisView.when)
}
restoreFromUrl();

// ── Drag handle mobile ────────────────────────────────────────────
(function() {
  const handle = document.getElementById('sidebar-drag-handle');
  const sidebar = document.getElementById('sidebar');
  if (!handle) return;
  let startY = 0, startT = 0;
  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY; startT = Date.now();
  }, { passive: true });
  handle.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startT;
    if (dt < 300) {
      sidebar.classList.toggle('closed');
    } else if (dy > 60) {
      sidebar.classList.add('closed');
    } else if (dy < -60) {
      sidebar.classList.remove('closed');
    }
  }, { passive: true });
  // Tap sur le header aussi pour toggler sur mobile
  const header = document.querySelector('.sidebar-header');
  if (header) {
    header.addEventListener('touchend', e => {
      if (e.target.closest('input')) return; // ne pas bloquer le champ de recherche
      sidebar.classList.toggle('closed');
    }, { passive: true });
  }
})();

// ── Géolocalisation + Parcours à proximité ────────────────────────
let userLat = null, userLng = null;
let geoWatchId = null;
let proximityRadius = 30;
const geoBtn        = document.getElementById('geo-btn');
const userDot       = document.getElementById('user-location-dot');
const proxSection   = document.getElementById('proximity-section');
const proxList      = document.getElementById('proximity-list');
const proxRange     = document.getElementById('proximity-range');
const proxKm        = document.getElementById('proximity-km');
const proxCloseBtn  = document.getElementById('proximity-close-btn');

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function buildProximityList() {
  if (userLat === null || !allFeatures.length) return;
  const nearby = allFeatures
    .map(f => {
      if (!f.geometry) return null;
      const dist = haversineKm(userLat, userLng, f.geometry.y, f.geometry.x);
      return dist <= proximityRadius ? { f, dist } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.dist - b.dist);

  sidebarCount.textContent = nearby.length
    ? `${nearby.length} parcours à moins de ${proximityRadius} km`
    : `Aucun parcours dans un rayon de ${proximityRadius} km`;

  if (!nearby.length) {
    proxList.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#009ec2" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <div class="empty-state-title">Aucun parcours trouvé</div>
      <div class="empty-state-sub">Essaie d'augmenter le rayon de recherche.</div>
    </div>`;
    return;
  }

  proxList.innerHTML = nearby.map(({ f, dist }) => {
    const p = f.attributes;
    const nom = p.NOM || p.NOM_RTE_BLEUE || '–';
    const rb  = p.NOM_RTE_BLEUE && p.NOM_RTE_BLEUE !== nom ? p.NOM_RTE_BLEUE : (p.MUNIC || '');
    const milieu = MILIEU_LBL[p.TYPE_MILIEUX] || '';
    return `<div class="proximity-item" data-oid="${p.OBJECTID}">
      <div class="proximity-dist">${dist.toFixed(1)} km</div>
      <div>
        <div class="proximity-nom">${nom}</div>
        <div class="proximity-rb">${[rb, milieu].filter(Boolean).join(' · ')}</div>
      </div>
    </div>`;
  }).join('');

  // Clic sur un item de proximité → ouvrir le popup
  proxList.querySelectorAll('.proximity-item').forEach(el => {
    el.addEventListener('click', () => {
      const oid = el.dataset.oid;
      const f = featMap[oid];
      if (f && arcgisView) {
        arcgisView.goTo({ center: [f.geometry.x, f.geometry.y], zoom: 13 }, { duration: 600 });
        setTimeout(() => showPopup(f), 700);
      }
    });
  });
}

// Slider rayon
if (proxRange) {
  proxRange.addEventListener('input', () => {
    proximityRadius = parseInt(proxRange.value);
    proxKm.textContent = `${proximityRadius} km`;
    buildProximityList();
  });
}

// Fermer la section proximité
if (proxCloseBtn) {
  proxCloseBtn.addEventListener('click', () => {
    proxSection.classList.remove('visible');
    document.getElementById('sidebar-list').style.display = '';
    sidebarCount.textContent = `${allFeatures.length} parcours · ${document.querySelectorAll('.region-group').length} régions`;
  });
}

function updateUserDot() {
  if (!arcgisView || userLat === null) return;
  const pt = arcgisView.toScreen({ longitude: userLng, latitude: userLat, spatialReference: { wkid: 4326 } });
  if (pt) {
    userDot.style.left = pt.x + 'px';
    userDot.style.top  = pt.y + 'px';
    userDot.style.display = 'block';
  } else {
    userDot.style.display = 'none';
  }
}

geoBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('Géolocalisation non supportée par ce navigateur.');
    return;
  }

  if (geoBtn.classList.contains('located')) {
    // Désactiver
    if (geoWatchId !== null) { navigator.geolocation.clearWatch(geoWatchId); geoWatchId = null; }
    geoBtn.classList.remove('located','locating');
    userDot.style.display = 'none';
    userLat = userLng = null;
    proxSection.classList.remove('visible');
    document.getElementById('sidebar-list').style.display = '';
    sidebarCount.textContent = `${allFeatures.length} parcours`;
    return;
  }

  geoBtn.classList.add('locating');
  let firstFix = true;

  geoWatchId = navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    geoBtn.classList.remove('locating');
    geoBtn.classList.add('located');
    if (!arcgisView) return;
    updateUserDot();

    if (firstFix) {
      firstFix = false;
      arcgisView.goTo({ center: [userLng, userLat], zoom: 10 }, { duration: 800 });
      // Afficher la section proximité et cacher la liste normale
      document.getElementById('sidebar-list').style.display = 'none';
      proxSection.classList.add('visible');
      // Sur mobile, ouvrir la sidebar
      document.getElementById('sidebar').classList.remove('closed');
      buildProximityList();
    } else {
      updateUserDot();
      buildProximityList();
    }
  }, err => {
    geoBtn.classList.remove('locating');
    const msgs = { 1:'Accès à la localisation refusé.', 2:'Position indisponible.', 3:'Délai dépassé.' };
    showToast(msgs[err.code] || 'Erreur de géolocalisation.');
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 });
});

require([
  "esri/Map","esri/views/MapView","esri/layers/FeatureLayer",
  "esri/symbols/SimpleMarkerSymbol","esri/renderers/SimpleRenderer","esri/geometry/Point",
  "esri/layers/GraphicsLayer","esri/Graphic"
], function(Map, MapView, FeatureLayer, SimpleMarkerSymbol, SimpleRenderer, Point, GraphicsLayer, Graphic) {

  const symCircle = new SimpleMarkerSymbol({
    style: 'circle', color: [0,37,105,1], size: 14,
    outline: { color: [255,255,255], width: 2 }
  });

  // Hover : légèrement plus grand + couleur plus pâle/claire
  const symHover = new SimpleMarkerSymbol({
    style: 'circle', color: [90,130,200,0.85], size: 18,
    outline: { color: [255,255,255], width: 2.5 }
  });

  const clusterConfig = {
    type: "cluster", clusterRadius: "80px",
    labelingInfo: [{
      deconflictionStrategy: "none",
      labelExpressionInfo: { expression: "Text($feature.cluster_count,'#,###')" },
      symbol: { type:"text", color:"#ffffff", font:{ weight:"bold", family:"sans-serif", size:"11px" } },
      labelPlacement: "center-center"
    }],
    symbol: { type:"simple-marker", style:"circle", color:[0,37,105,.9], size:28, outline:{ color:[255,255,255], width:2 } },
    clusterMinSize: "26px", clusterMaxSize: "56px", popupEnabled: false,
    maxScale: 150000  // désactive le clustering quand les lignes apparaissent
  };

  arcgisLayer = new FeatureLayer({
    url: LAYER_URL, outFields:['*'], popupEnabled:false,
    renderer: new SimpleRenderer({ symbol: symCircle }),
    featureReduction: clusterConfig,
    // Étiquettes du nom de parcours — visibles seulement au même zoom que les lignes
    labelingInfo: [{
      labelExpressionInfo: { expression: "$feature.NOM" },
      symbol: {
        type: "text",
        color: [0, 37, 105, 1],
        haloColor: [255, 255, 255, 0.9],
        haloSize: "2px",
        font: { family: "Montserrat, Arial, sans-serif", size: "11px", weight: "bold" }
      },
      labelPlacement: "above-center",
      minScale: 150000,   // même seuil que les lignes
      deconflictionStrategy: "dynamic"
    }],
    labelsVisible: true,
    minScale: 0  // le layer reste toujours visible (clusters au grand zoom)
  });

  // Couche sections (lignes) — apparaît seulement à partir du zoom ~10 (≈ 150 000)
  sectionLayer = new FeatureLayer({
    url: SECTION_URL,
    outFields: ['NOM_SECTN', 'NO_REG_TOURST', 'ID_SECTN'],
    popupEnabled: false,
    minScale: 150000,   // invisible en vue globale, apparaît en zoomant
    renderer: {
      type: 'simple',
      symbol: {
        type: 'simple-line',
        color: [0, 37, 105, 0.75],
        width: 3,
        style: 'solid'
      }
    }
  });

  // Couche de surligné personnalisé — insérée ENTRE sectionLayer et arcgisLayer
  highlightGraphicsLayer = new GraphicsLayer({ listMode:'hide' });

  const map = new Map({ basemap:'streets-navigation-vector', layers:[sectionLayer, highlightGraphicsLayer, arcgisLayer] });

  // Couche pour le marqueur de scrubbing élévation
  elevGraphicsLayer = new GraphicsLayer({ listMode:'hide' });
  ArcGISGraphic = Graphic; // exposer globalement pour loadElevation et highlightSection
  map.add(elevGraphicsLayer);
  arcgisView = new MapView({
    container:'viewDiv', map,
    center: DEFAULT_CENTER, zoom: DEFAULT_ZOOM,
    popup: { autoOpenEnabled: false },
    highlightOptions: {
      color:        [0, 180, 216, 0.35],   // cyan très pâle
      fillOpacity:  0.18,
      haloOpacity:  0.28,
      haloColor:    [0, 180, 216]
    }
  });

  arcgisView.ui.remove('zoom');
  arcgisView.watch('extent', repositionPopup);
  arcgisView.watch('extent', updateUserDot);  // met à jour le point GPS quand la carte bouge

  arcgisView.when(async () => {
    allFeatures = await fetchPaginated();

    allFeatures.forEach(f => { featMap[String(f.attributes.OBJECTID)] = f; });

    buildSidebar(allFeatures);

    // Restaurer l'état depuis l'URL
    const urlParams = new URLSearchParams(location.search);
    const hasFilters = filterState.niveau||filterState.region||filterState.duree||filterState.milieu||filterState.trajet||filterState.locat||filterState.gratuit||filterState.ouvert;
    if (hasFilters) applyFilters();
    if (urlParams.has('zoom') && urlParams.has('lat') && urlParams.has('lng')) {
      arcgisView.goTo({ center: [parseFloat(urlParams.get('lng')), parseFloat(urlParams.get('lat'))], zoom: parseInt(urlParams.get('zoom')) }, { duration: 0 });
    }
    if (urlParams.has('oid')) {
      const oid = urlParams.get('oid');
      const f = featMap[oid];
      if (f) {
        setTimeout(async () => {
          await showPopup(f.attributes, f.geometry.y, f.geometry.x);
          const item = sidebarList.querySelector(`[data-oid="${oid}"]`);
          if (item) { item.classList.add('active'); activeItem = item; item.scrollIntoView({block:'nearest'}); }
        }, 500);
      }
    }

    // Mettre à jour le point de géolocalisation à chaque mouvement de carte
    arcgisView.watch('extent', updateUserDot);

    // Cadrer la vue initiale sur l'ensemble des parcours et la mémoriser
    sectionLayer.queryExtent({ where: '1=1', outSpatialReference: arcgisView.spatialReference })
      .then(result => {
        if (result && result.extent) {
          initialExtent = result.extent.expand(1.1);
          arcgisView.goTo(initialExtent, { duration: 800 });
        }
      }).catch(() => {});

    // ── Filtre spatial ──────────────────────────────────────────
    const spatialBtn = document.getElementById('spatial-btn');

    function applySpatialFilter() {
      if (!spatialFilterActive || !arcgisView) return;
      const sw = arcgisView.toMap({ x: 0, y: arcgisView.height });
      const ne = arcgisView.toMap({ x: arcgisView.width, y: 0 });
      const groups = sidebarList.querySelectorAll('.region-group');
      let visible = 0;
      groups.forEach(g => {
        const gItems = g.querySelectorAll('.parcours-item');
        let gv = 0;
        gItems.forEach(item => {
          const f = featMap[String(item.dataset.oid)];
          if (!f || !f.geometry) { item.style.display = 'none'; return; }
          const inView = f.geometry.x >= sw.longitude && f.geometry.x <= ne.longitude &&
                         f.geometry.y >= sw.latitude  && f.geometry.y <= ne.latitude;
          item.style.display = inView ? '' : 'none';
          if (inView) gv++;
        });
        g.style.display = gv > 0 ? '' : 'none';
        if (gv > 0) {
          g.querySelector('.region-items').classList.remove('hidden');
          g.querySelector('.region-header').classList.remove('collapsed');
        }
        visible += gv;
      });
      sidebarCount.textContent = `${visible} parcours visibles`;
    }

    function clearSpatialFilter() {
      sidebarList.querySelectorAll('.parcours-item').forEach(i => i.style.display = '');
      sidebarList.querySelectorAll('.region-group').forEach(g => g.style.display = '');
      sidebarList.querySelectorAll('.region-items').forEach(d => d.classList.add('hidden'));
      sidebarList.querySelectorAll('.region-header').forEach(h => h.classList.add('collapsed'));
      sidebarCount.textContent = `${allFeatures.length} parcours`;
    }

    spatialBtn.addEventListener('click', () => {
      spatialFilterActive = !spatialFilterActive;
      spatialBtn.classList.toggle('active', spatialFilterActive);
      spatialFilterActive ? applySpatialFilter() : clearSpatialFilter();
    });

    arcgisView.watch('extent', () => {
      if (!spatialFilterActive) return;
      clearTimeout(spatialFilterTimer);
      spatialFilterTimer = setTimeout(applySpatialFilter, 400);
    });

    // Clic carte
    arcgisView.on('click', async (event) => {
      const response = await arcgisView.hitTest(event, { include:[arcgisLayer] });
      const hit = response.results.find(r => r.layer === arcgisLayer);
      if (!hit) { closePopup(); return; }

      if (hit.graphic.isAggregate) {
        arcgisView.goTo({ target:hit.graphic.geometry, zoom:arcgisView.zoom+2 }, { duration:500 });
        return;
      }

      const oid      = String(hit.graphic.attributes.OBJECTID);
      const listItem = sidebarList.querySelector(`[data-oid="${oid}"]`);
      if (activeItem) activeItem.classList.remove('active');
      if (listItem) {
        listItem.classList.add('active');
        const parentItems = listItem.closest('.region-items');
        if (parentItems && parentItems.classList.contains('hidden')) {
          parentItems.classList.remove('hidden');
          parentItems.previousElementSibling.classList.remove('collapsed');
        }
        listItem.scrollIntoView({ behavior:'smooth', block:'nearest' });
        activeItem = listItem;
      }
      resetBtn.classList.add('visible');

      activeGeometry = hit.graphic.geometry;
      // Zoomer + surligner la géométrie réelle de la section
      const sectnId = hit.graphic.attributes.ID_SECTN;
      if (sectnId && sectionLayer) {
        highlightSection(sectnId);
        sectionLayer.queryExtent({
          where: `ID_SECTN = ${sectnId}`,
          outSpatialReference: arcgisView.spatialReference
        }).then(result => {
          if (result && result.extent) {
            arcgisView.goTo(result.extent.expand(1.5), { duration: 600 });
          }
        }).catch(() => {});
      }
      await showPopup(hit.graphic.attributes, hit.graphic.geometry.latitude, hit.graphic.geometry.longitude);
      activeGeometry = hit.graphic.geometry;
    });

    // Curseur + hover dynamique sur les points
    let hoveredGraphic = null;
    arcgisView.on('pointer-move', async (event) => {
      const response = await arcgisView.hitTest(event, { include:[arcgisLayer] });
      const hit = response.results.find(r => r.layer === arcgisLayer);

      if (hit && !hit.graphic.isAggregate) {
        arcgisView.container.style.cursor = 'pointer';
        if (hoveredGraphic !== hit.graphic) {
          // Rétablir l'ancien
          if (hoveredGraphic) hoveredGraphic.symbol = symCircle;
          hoveredGraphic = hit.graphic;
          hoveredGraphic.symbol = symHover;
        }
      } else {
        arcgisView.container.style.cursor = hit ? 'pointer' : 'default';
        if (hoveredGraphic) { hoveredGraphic.symbol = symCircle; hoveredGraphic = null; }
      }
    });

    // Clic liste
    sidebarList.addEventListener('click', async (e) => {
      const item = e.target.closest('.parcours-item');
      if (!item) return;
      const oid     = item.dataset.oid;
      const feature = featMap[oid];
      if (!feature || !feature.geometry) return;

      if (activeItem) activeItem.classList.remove('active');
      item.classList.add('active');
      activeItem = item;
      resetBtn.classList.add('visible');

      const geom = new Point({
        longitude: feature.geometry.x,
        latitude:  feature.geometry.y,
        spatialReference: { wkid: 4326 }
      });

      // Zoom sur la géométrie réelle de la ligne (sectionLayer) via ID_SECTN
      const secId = feature.attributes.ID_SECTN;

      activeGeometry = geom;

      // Zoomer sur la ligne de section réelle, puis afficher le popup
      const doZoomAndPopup = async () => {
        await new Promise(r => setTimeout(r, 80));
        await showPopup(feature.attributes, feature.geometry.y, feature.geometry.x);
        activeGeometry = geom;
      };

      if (secId && sectionLayer) {
        highlightSection(secId);
        sectionLayer.queryExtent({
          where: `ID_SECTN = ${secId}`,
          outSpatialReference: arcgisView.spatialReference
        }).then(async result => {
          if (result && result.extent) {
            await arcgisView.goTo(result.extent.expand(1.5), { duration: 700 });
          } else {
            await arcgisView.goTo({ target: geom, zoom: 13 }, { duration: 700 });
          }
          await doZoomAndPopup();
        }).catch(async () => {
          await arcgisView.goTo({ target: geom, zoom: 13 }, { duration: 700 });
          await doZoomAndPopup();
        });
      } else {
        await arcgisView.goTo({ target: geom, zoom: 13 }, { duration: 700 });
        await doZoomAndPopup();
      }
    });
  });
});
</script>
</body>
</html>
